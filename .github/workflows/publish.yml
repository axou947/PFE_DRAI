# Daily publication of the regime to track_record/, on real data only.
# Needs two repository secrets: FRED_API_KEY and TIINGO_API_KEY
# (Settings > Secrets and variables > Actions). Without them the run fails
# instead of publishing simulated data.
name: Publish regime

on:
  workflow_dispatch:
  schedule:
    - cron: "30 22 * * 1-5" # every business day after the US close

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e . opentimestamps-client
      - name: Complete earlier timestamps
        # A fresh OpenTimestamps proof is only anchored in Bitcoin a few hours later.
        run: for f in track_record/*.ots; do [ -e "$f" ] && ots upgrade "$f" || true; done
      - name: Publish today's regime
        run: python -m pfe_drai --provider fred publish
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY }}
      - name: Commit
        run: |
          git config user.name "regime-bot"
          git config user.email "regime-bot@users.noreply.github.com"
          git add track_record
          git commit -m "Track record $(date -u +%F)" || { echo "nothing to publish"; exit 0; }
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
