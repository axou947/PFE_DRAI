# Daily publication of the regime to track_record/, on real data only, and of the public
# track-record page built from it (track_record/index.html and fr.html, docs/TRACK_RECORD.md).
# The UK, Japan and emerging markets are published next to it in track_record/<region>/ (docs/REGIONS.md).
# Needs two repository secrets: FRED_API_KEY and TIINGO_API_KEY
# (Settings > Secrets and variables > Actions). Without them the run fails
# instead of publishing simulated data.
name: Publish regime

on:
  workflow_dispatch:
  schedule:
    - cron: "30 22 * * 1-5" # every business day after the US close

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e . opentimestamps-client
      - name: Complete earlier timestamps
        # A fresh OpenTimestamps proof is only anchored in Bitcoin a few hours later.
        run: find track_record -name '*.ots' -print0 | xargs -0 -r -n1 ots upgrade || true
      - name: Publish today's regime
        # On failure the error class and the failing series go to the job summary (no keys, no
        # prices). On success the same step writes track_record/health/<day>.json: the data checks.
        id: publish
        run: python -m pfe_drai --provider fred publish
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY }}
      - name: Build the track-record page
        # Writes the backtest record once per configuration, then the page. Its failure must
        # not cost the day's entry: the entry is committed anyway and the run fails at the end.
        id: page
        continue-on-error: true
        run: python -m pfe_drai --provider fred track-record
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY }}
      - name: Publish the regions
        # UK, Japan and emerging markets each passed their pre-registered rule (docs/REGIONS.md). Each has
        # its own folder and hash chain in track_record/<region>/. A regional failure never costs the US
        # day: the other regions still run, everything is committed, and the run ends with a warning.
        id: regions
        continue-on-error: true
        run: |
          failed=""
          for region in uk japan em; do
            python -m pfe_drai --region "$region" publish || failed="$failed $region"
          done
          echo "failed=${failed# }" >> "$GITHUB_OUTPUT"
          test -z "$failed"
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY }}
      - name: Commit
        id: commit
        run: |
          git config user.name "regime-bot"
          git config user.email "regime-bot@users.noreply.github.com"
          git add track_record
          git commit -m "Track record $(date -u +%F)" || { echo "nothing to publish"; echo "new=false" >> "$GITHUB_OUTPUT"; exit 0; }
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
          echo "new=true" >> "$GITHUB_OUTPUT"
      - name: Send alerts
        # After the commit and only when this run pushed a new day, so a re-run on a holiday or the
        # same day sends nothing. A mail failure never fails or reorders the daily record
        # (docs/ALERTS.md). Off unless the repository variable ALERTS_ENABLED is 'true' (and alerts.enabled
        # is true in the settings). Without ALERT_* secrets it prints "no channel configured" and succeeds.
        id: alerts
        if: vars.ALERTS_ENABLED == 'true' && steps.commit.outputs.new == 'true' && steps.publish.outcome == 'success'
        continue-on-error: true
        run: python -m pfe_drai notify
        env:
          ALERT_SMTP_HOST: ${{ secrets.ALERT_SMTP_HOST }}
          ALERT_SMTP_PORT: ${{ secrets.ALERT_SMTP_PORT }}
          ALERT_SMTP_USER: ${{ secrets.ALERT_SMTP_USER }}
          ALERT_SMTP_PASSWORD: ${{ secrets.ALERT_SMTP_PASSWORD }}
          ALERT_EMAIL_FROM: ${{ secrets.ALERT_EMAIL_FROM }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
      - name: Record what was sent
        # track_record/alerts/<day>.json lists event and channel names only (no address, no URL):
        # it is what stops a manual re-run from sending the same transition twice.
        if: steps.alerts.outcome != 'skipped'
        continue-on-error: true
        run: |
          git add track_record/alerts
          git commit -m "Alerts sent $(date -u +%F)" || { echo "no alert sent"; exit 0; }
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
      - name: Report an alert failure
        if: steps.alerts.outcome == 'failure'
        run: echo "::warning::An alert channel failed (class name in the Send alerts log). The day's entry is committed; see docs/ALERTS.md to resend."
      - name: Report a region failure
        if: steps.regions.outcome == 'failure'
        run: echo "::warning::Regional publication failed for ${{ steps.regions.outputs.failed }} (log of 'Publish the regions'). The US entry is committed."
      - name: Report a page failure
        if: steps.page.outcome == 'failure'
        run: |
          echo "::error::The track-record page did not build; today's entry was still committed."
          exit 1
      - name: Report the data health
        # After the commit, so a degraded source never costs the day's entry: the entry is committed
        # labelled, and the run fails here when a source is stale (docs/OPERATIONS.md).
        if: always() && steps.publish.outcome == 'success'
        run: python -m pfe_drai health --run-summary

  # Public page on GitHub Pages. Off until an admin of the repository sets
  # Settings > Pages > Source to "GitHub Actions" (docs/TRACK_RECORD.md); until then this job
  # only prints a notice and the page stays readable in the repository.
  pages:
    needs: publish
    if: always() && needs.publish.result != 'cancelled'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }} # the commit the publish job just pushed
      - name: Check that GitHub Pages is on
        id: pages
        continue-on-error: true
        uses: actions/configure-pages@v5
      - name: Pages is off
        if: steps.pages.outcome != 'success'
        run: echo "::notice::GitHub Pages is not enabled for this repository (Settings > Pages > Source > GitHub Actions). Skipping the deploy."
      - uses: actions/upload-pages-artifact@v3
        if: steps.pages.outcome == 'success'
        with:
          path: track_record
      - id: deploy
        if: steps.pages.outcome == 'success'
        uses: actions/deploy-pages@v4
