# Daily publication of the regime to track_record/.
# Manual only for now: enable the schedule once real data is plugged in
# (publishing simulated data would pollute the track record).
name: Publish regime

on:
  workflow_dispatch:
  # schedule:
  #   - cron: "30 22 * * 1-5"   # every business day after the US close

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e . opentimestamps-client
      - run: python -m pfe_drai publish
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      - run: |
          git config user.name "regime-bot"
          git config user.email "regime-bot@users.noreply.github.com"
          git add track_record
          git commit -m "Track record $(date -u +%F)" || echo "nothing to publish"
          git push
