# PFE DRAI settings. Every value here can be changed without touching the code.
# Override the file path with the PFE_DRAI_CONFIG environment variable.

data:
  # Which data source to use: synthetic | csv | fred | tiingo | yahoo
  # "synthetic" generates realistic simulated data (no API key needed).
  # Real data: provider: fred with fred_fallback: tiingo (macro + VIX from FRED,
  # ETF prices from Tiingo). Needs FRED_API_KEY and TIINGO_API_KEY.
  provider: synthetic
  start: "2000-01-03"
  end: null                 # null = today
  seed: 42                  # synthetic data only
  csv_dir: data_cache/csv   # csv provider: one <series>.csv per series (date,value)
  fred_api_key_env: FRED_API_KEY
  fred_fallback: tiingo     # source of the series FRED does not have (ETF prices)
  tiingo_api_key_env: TIINGO_API_KEY
  # Days between the end of the reference period and the release (point-in-time).
  # Real data (fred) reads release dates from ALFRED instead; these lags only date
  # the other providers and observations older than ALFRED's archive.
  publication_lag_days:
    indpro: 17
    cpi: 14
    claims: 5               # week ending Saturday, published the next Thursday
  # fred: read revised series (claims, IP, CPI) as first releases from ALFRED.
  # false = today's revised values, which leak the future into backtests.
  point_in_time: true
  cache_dir: data_cache

features:
  zscore_min_periods: 252   # expanding z-scores: no look-ahead
  zscore_clip: 4.0
  # How the growth score is built (docs/SLOWDOWN.md). Every feature still feeds the models;
  # only `inputs` are averaged into the growth score.
  # v2.2, adopted 2026-10-01 under the pre-registered rule (docs/SLOWDOWN.md): robust scaling (one
  # extreme stretch such as 2020 no longer squeezes every later reading) and a month's average.
  # v2.1 was the same four inputs with standard scaling and no average (validation.slowdown.before).
  growth:
    inputs: [equity_momentum, curve_slope, industrial_production, jobless_claims]
    scaling: robust           # standard = expanding mean and std | robust = expanding median and IQR
    smooth_days: 21           # growth score averaged over this many business days (0 = none)

regimes:
  # Order matters: it fixes colors and chart order.
  order: [expansion, overheating, slowdown, stress]
  colors:
    expansion: "#1baf7a"
    overheating: "#eda100"
    slowdown: "#2a78d6"
    stress: "#4a3aa7"
  # Transparent rule that defines the regimes on the three dimension scores. It labels history
  # (target of the supervised models) and names the states of the unsupervised ones: each state
  # takes the name of the closest regime centre, the average day of that regime (docs/REGIMES.md).
  rule:
    stress_threshold: 1.0
    # Growth below its own historical median: below-trend growth (v2.2). Was -0.25, set by hand.
    growth_threshold: 0.0
    inflation_threshold: 0.8

models:
  # Name of this model configuration, shown on the track record next to its settings fingerprint.
  # v2.1 = detection v2 + calibrated P(stress); v2.2 = v2.1 + a real Slowdown regime (docs/SLOWDOWN.md).
  version: "v2.2"
  # combined = jump model regimes, P(stress) = max(jump, gbm, onset): v2, chosen on simulated
  # data and a real 1999-2009 holdout, confirmed once on the 11 real episodes (docs/DETECTION_V2.md).
  default: combined
  combined:
    # Models whose P(stress) can raise the jump model's. [gbm] = v1 (PR #5).
    # [gbm, onset] = v2, adopted 2026-10-01 under the pre-registered rule (docs/DETECTION_V2.md).
    stress_sources: [gbm, onset]
    # How the sources make the P(stress) that is shown and published (docs/CALIBRATION.md).
    # max = v2: the highest source. calibrated = Platt scaling of that highest source, refitted
    # walk-forward on past out-of-sample days, so "30%" means stress followed about 3 times in 10.
    # The stress alarm does not change: it stays on the highest source (validation.alarm).
    # Adopted 2026-10-01 under the pre-registered rule (real data: Brier 0.100 -> 0.091, ECE 0.083 -> 0.042).
    stress_combination: calibrated
    stack:
      inputs: max             # max = Platt scaling of the highest source | sources = one weight per source
      transform: logit        # the calibrator reads log-odds (Platt) | prob
      warmup_days: 504        # sources start predicting 2 years in, so the calibrator has out-of-sample history
      refit_every_days: 126
      l2: 1.0                 # ridge penalty on the weights (weights also kept >= 0)
      clip: 0.001             # probabilities clipped to [0.1%, 99.9%] before the logit
      min_event_days: 20      # fewer stress-event days in the past: show the highest source instead
  kmeans:
    n_init: 10
  jump:
    penalty: 6.0            # cost of switching regime (higher = fewer switches); was 12, see docs/DETECTION.md
    n_iter: 15
    temperature: 3.0        # softness of the probabilities
  gbm:
    horizon_days: 5         # predicts the regime one week ahead
    max_iter: 100
    refit_every_days: 252     # slower to fit: refit once a year in walk-forward
    learning_rate: 0.06
  onset:
    # Stress-onset detector (docs/DETECTION_V2.md): learns the start of the frozen episodes
    # from fast market inputs. learner and inputs selected by the pre-registered holdout
    # (real data, 1999-2009, run 2026-10-01).
    learner: gbm            # gbm | logistic
    inputs: market          # market | market_credit (features/market.py)
    horizon_days: 5         # target: an episode starts within a week...
    after_start_days: 21    # ...or started less than a month ago
    hold_days: 5            # a probability holds 5 days (minimum time on), against flicker
    refit_every_days: 252
    max_iter: 100           # gbm learner only, same as models.gbm
    learning_rate: 0.06

validation:
  min_train_days: 1260      # 5 years before the first out-of-sample prediction
  refit_every_days: 126
  # Rule that dates the start of each stress episode. Fixed BEFORE any backtest.
  episodes:
    drawdown_threshold: -0.10     # drawdown from 252-day high
    vol_window: 21
    vol_quantile: 0.95            # realised vol above its expanding 95th percentile
    min_gap_days: 21              # business days between an episode end and the next start
    recovery_drawdown: -0.05      # episode ends when the drawdown recovers above this
    max_duration_days: 126        # ...or after this many business days
    detection_window_days: 60     # a detection later than this counts as missed
    lookback_days: 20             # a detection up to 20 days early counts
    # Frozen before any backtest on real data: the code refuses a rule whose parameters
    # no longer match this hash. A new version needs a new hash, a date and a public reason.
    frozen:
      sha256: 6741b6747b53b7cf5c1f9de0c5fedd9caccd111d49c9dbf63fde3a2010b8397a
      date: "2026-10-01"
  # Fresh holdout for the onset detector (docs/DETECTION_V2.md): US history before the real-data
  # out-of-sample period, never scored before. SPY starts 1993-01-29, VIX 1990, LQD/IEF 2002.
  holdout:
    start: "1993-01-29"
    end: "2009-04-02"       # the day before the real-data out-of-sample period starts
    candidates:
      - {learner: logistic, inputs: market}
      - {learner: logistic, inputs: market_credit}
      - {learner: gbm, inputs: market}
      - {learner: gbm, inputs: market_credit}
  stress_probability_threshold: 0.5
  # Is Slowdown a real regime? Outside reference of below-trend growth, never a model input
  # (docs/SLOWDOWN.md): Chicago Fed National Activity Index, 3-month average, below 0.
  slowdown:
    reference: {fred: CFNAIMA3, below: 0.0}
    # Decision rule of the one real run: calibration may not get worse (docs/SLOWDOWN.md).
    calibration_tolerance: {brier: 0.0, ece: 0.005}
    # The published growth score (v2.1): the "before" of `slowdown`, run on the same data as the "after".
    before:
      growth: {inputs: [equity_momentum, curve_slope, industrial_production, jobless_claims], scaling: standard, smooth_days: 0}
      rule: {growth_threshold: -0.25}
    # v2.2 as it was tested (same as the current settings): `slowdown --tested` reproduces the run.
    tested:
      growth: {inputs: [equity_momentum, curve_slope, industrial_production, jobless_claims], scaling: robust, smooth_days: 21}
      rule: {growth_threshold: 0.0}
    # Growth-score holdout, real US data before the out-of-sample period (validation.holdout window).
    holdout:
      evaluate_from: "1999-01-04"
      max_spells_per_year: 2.0    # a regime that changes more often is not a state of the economy
      tie: 0.01                   # balanced accuracy within 1 point of the best counts as a tie
      candidates:
        - name: "three inputs (no curve slope)"
          growth: {inputs: [equity_momentum, industrial_production, jobless_claims], scaling: robust, smooth_days: 21}
          rule: {growth_threshold: 0.0}
        - name: "four inputs (with curve slope)"
          growth: {inputs: [equity_momentum, curve_slope, industrial_production, jobless_claims], scaling: robust, smooth_days: 21}
          rule: {growth_threshold: 0.0}
        - name: "macro only (production, claims)"
          growth: {inputs: [industrial_production, jobless_claims], scaling: robust, smooth_days: 21}
          rule: {growth_threshold: 0.0}
  # Calibration of P(stress) (docs/CALIBRATION.md): the event a probability is checked against.
  calibration:
    target_horizon_days: 5    # inside a frozen episode, or one starts within 5 business days
    bins: 10                  # reliability chart and ECE: 10 bins of 10 points
  confirm_days: 3                 # a signal must hold this many days to count
  targets:
    max_median_latency_days: 5
    max_false_positives_per_year: 1.5
    # Added with v2 (docs/DETECTION_V2.md), before any run on real data: false positives count
    # alarm onsets, so a signal that stays on would pass. 10% of calm days = 1.5 alarms a year
    # of about three weeks each.
    max_false_alarm_share: 0.10

# Inflation score, one vote per source (docs/INFLATION.md): the pre-registered check, not the model.
# NOT ADOPTED 2026-10-03: worse on simulated data (13 seeds), so no real run was made; the inflation score
# stays one vote per input. Kept outside features/models/validation on purpose: those make the settings
# fingerprint of the published model, and this block only describes the test.
overheating:
  # Outside reference of high inflation, never a model input: core PCE prices (the Fed's preferred
  # measure, not CPI), change over 12 months, above 2.5% (half a point above the Fed's 2% target).
  reference: {fred: PCEPILFE, above: 2.5}
  # What the app displays must improve by a margin, not by noise: Slowdown's 0.012 (docs/SLOWDOWN.md) was not
  # evidence. The inflation score's own match needs no margin; it is close to mechanical (CPI and PCE move together).
  min_gain: {shown_ba: 0.02}
  calibration_tolerance: {brier: 0.0, ece: 0.005}
  # The published inflation score (v2.2): one vote per input.
  before:
    inflation: {weighting: inputs}
  # v2.3 as tested: one vote per source, the inputs of one source averaged first.
  tested:
    inflation:
      weighting: sources
      sources:
        cpi: [cpi_inflation]
        breakeven: [breakeven_level, breakeven_change]
        short_rate: [short_rate_change]

# Sahm rule in the growth score (docs/SAHM_HY.md): the pre-registered test, not the model.
# NOT ADOPTED 2026-10-03: step 1 failed on the real 1999-2009 holdout (balanced accuracy 0.731 vs 0.757). Kept outside
# features/models/validation on purpose, so the published model's settings fingerprint does not change.
sahm:
  series: unrate                  # unemployment rate, FRED UNRATE as first releases (ALFRED)
  publication_lag_days: 7         # employment report: the first Friday after the month (other providers)
  # Step 1 passes only on a gain, not on noise: the same margin as the displayed Overheating (docs/INFLATION.md).
  min_gain: {balanced_accuracy: 0.02}
  holdout:
    candidates:
      - name: "v2.2 (published)"
        growth: {inputs: [equity_momentum, curve_slope, industrial_production, jobless_claims], scaling: robust, smooth_days: 21}
        rule: {growth_threshold: 0.0}
      - name: "v2.2 + Sahm gap"
        growth: {inputs: [equity_momentum, curve_slope, industrial_production, jobless_claims, unemployment_gap], scaling: robust, smooth_days: 21}
        rule: {growth_threshold: 0.0}

# Displayed Slowdown v2.3 (docs/SLOWDOWN_V23.md): the pre-registered test, not the model. Fixed on 2026-10-03 before any
# real run. NOT ADOPTED 2026-10-03: the one real run selected no candidate on 2009-2017 (best +0.003 vs 0.02). Kept outside features/models/validation on purpose: the published model's settings fingerprint does not
# change. If adopted, models.combined.calm is set to the selected display and models.version to v2.3.
slowdown_v23:
  baseline: jump                  # v2.2: the calm share split in the jump model's proportions
  candidates: [rule, rule_named, gbm]   # in this order: ties go to the earlier one (pfe_drai/display.py)
  split: "2018-01-01"             # selection before this day, decision from it (out-of-sample period halves)
  guards: {max_switches_per_year: 4.0, min_median_spell: 15}
  select: {min_gain: 0.02, tie: 0.01}
  decide: {min_ba: 0.55, min_gain: 0.02}
  # Second reference, never used to score any version: real GDP grew slower than CBO potential GDP that quarter.
  second_reference: {actual: GDPC1, potential: GDPPOT}

# Challenger track record (docs/CHALLENGERS.md): candidate models published live every market day next to the
# published model, each in its own hash-chained folder, scored only on what happens after its first day.
# Outside features/models/validation: the published model's fingerprint and entries never change because of it.
# Fixed on 2026-10-03 before any challenger was published; a challenger is never retuned while it runs.
challengers:
  dir: track_record/challengers
  models:
    vix_term:
      label: "v2.2 + VIX term structure"
      # VIX over the 3-month VIX (FRED VXVCLS, from Dec 2007) and its 5-day change, read by the onset detector.
      series: [vix3m]
      settings: {models: {onset: {inputs: market_vix_term}}}
    hy_credit:
      label: "v2.2 + high-yield credit"
      # High-yield fund (VWEHX) against a Treasury fund (VFITX), 5 and 21 days, read by the onset detector.
      series: [hy_fund, treasury_fund]
      settings: {models: {onset: {inputs: market_hy_fund}}}
  # When a challenger may be put forward for a pre-registered adoption run (docs/CHALLENGERS.md).
  review:
    min_live_episodes: 3

alerts:
  stress_probability: 0.5
  early_warning_probability: 0.4  # gbm probability of stress in one week
  score_jump: 1.0                 # 5-day move of a dimension score
  # Messages when the published alarm switches (docs/ALERTS.md). A channel only sends when its
  # ALERT_* environment variables are set (GitHub secrets); addresses and URLs are never in this file.
  # OFF for now: the code is kept and tested but never called (daily job, app) until the app's UX is settled.
  # To switch on: enabled: true here AND the repository variable ALERTS_ENABLED=true (docs/ALERTS.md).
  enabled: false
  channels: [email, webhook]
  notify:
    events: [alarm_on, alarm_off, regime_change]
    language: both                  # fr, en or both (French then English)

world:
  # World tab (docs/WORLD.md): country equity ETFs as proxies for licensed indices.
  markets: config/markets.yaml
  # Market-only stress state per country, from its own prices. Set before looking at any
  # real country data (2026-10-01), same values for every market; not tuned.
  vol_window: 21              # realised volatility window (business days)
  vol_history_days: 1260      # vol is ranked within the market's own last 5 years...
  vol_min_history: 252        # ...once it has at least 1 year of vol history
  drawdown_window: 252        # drawdown from the 1-year high
  stress:   {vol_percentile: 0.90, drawdown: -0.10}   # both conditions
  elevated: {vol_percentile: 0.80}                    # vol alone
  confirm_days: 3             # a new state counts once it has held 3 days in a row
  stale_days: 5               # a market with no close in the last 5 days shows as no data
  # Local-currency display values (docs/WORLD.md): FRED H.10 rates are weekly, so the latest days are
  # missing. A rate is carried at most this many trading days over a gap, never past its last date.
  fx_fill_days: 2
  # Link to the US: fixed on 2026-10-02 before any real number was looked at, not tuned.
  link:
    return_days: 5            # headline on overlapping 5-day log returns (Asia/Australia timing)
    windows: [63, 252]        # business days: about a quarter and a year
    min_share: 0.9            # a window counts once 90% of it holds a return pair
    min_markets: 5            # average correlation needs at least 5 markets
    stress_window: 1260       # "in US stress" vs "other days" correlation over 5 years...
    min_stress_days: 20       # ...and only with at least 20 US stress days in it

learn:
  # Learn pages (docs/LEARN.md): concept cards for beginners and professionals, US data and Fed odds.
  # Display only: outside features/regimes/models/validation, so the model's settings fingerprint and
  # the published track record never change because of it.
  indicators: config/learn/indicators.yaml
  fomc: config/learn/fomc.yaml
  cards: config/learn/cards
  glossary: config/learn/glossary.yaml
  episodes: config/learn/episodes.yaml
  start: "1960-01-01"       # history for the charts and the base rates (FRED today's vintages)
  fed:
    # What Treasury bill yields imply for the Fed (docs/LEARN.md). Bills carry a small premium over the
    # expected policy rate; it is measured as the median bill-minus-fed-funds spread over the last
    # `basis_years` on days when the target did not move for a whole bill's life either side.
    basis_years: 3
    basis_min_days: 60        # fewer clean days than this: use default_basis_pct instead
    default_basis_pct: {DGS3MO: 0.08, DGS6MO: 0.12}
    meeting_spacing_days: 45  # after the last FOMC date listed in fomc.yaml
    step_pct: 0.25            # one Fed move
    # Taylor rules: i = r* + pi + a (pi - 2) + b gap, gap = okun x (NROU - UNRATE), pi = core PCE y/y.
    taylor:
      r_star: 1.0             # neutral real rate (%), in the range of the published estimates
      okun: 2.0
      rules:
        taylor_1993: {a: 0.5, b: 0.5}
        balanced: {a: 0.5, b: 1.0}
      inertia: 0.85           # inertial rule = inertia x current target + (1 - inertia) x balanced
    # Base rates: what the Fed did over the next `horizon_months` in the `neighbours` past months that
    # looked most like the chosen month (core PCE, unemployment gap and trend, last year's Fed moves).
    base_rates:
      start: "1985-01-01"
      horizon_months: 3
      neighbours: 40
      move_pct: 0.1           # a target change bigger than this counts as a hike or a cut
  # Recession checklist thresholds, all standard and published (not tuned on our data).
  checklist:
    sahm_red: 0.5             # Sahm rule (Claudia Sahm, 2019)
    sahm_amber: 0.3
    claims_rise_amber: 0.15   # 4-week average of claims vs its 52-week low
    claims_rise_red: 0.30
    payrolls_amber_k: 50      # average monthly job creation, last 3 months (thousands)

scenarios:
  library: config/scenarios.yaml
  funds: config/funds.yaml
  top_k: 3

publish:
  dir: track_record
  opentimestamps: true            # uses the `ots` CLI if installed
  require_live_data: true         # never publish simulated data to the track record
  # Public track-record page (track_record/index.html and fr.html, docs/TRACK_RECORD.md): links to the code.
  repository_url: https://github.com/axou947/PFE_DRAI
  pages_url: https://axou947.github.io/PFE_DRAI/   # once Settings > Pages > Source is GitHub Actions

# Daily job health (docs/OPERATIONS.md). Outside features/regimes/models/validation: changing it never
# changes the model's settings fingerprint or opens a new backtest record.
health:
  # A market day's entry is due this long after the US close (21:00 UTC). The 22:30 UTC cron often
  # starts hours late (01:46 UTC on 2026-10-01), so 9 h = 06:00 UTC the next morning.
  due_after_close_hours: 9
  # An entry older than this many days must have its OpenTimestamps proof anchored in Bitcoin.
  ots_upgrade_days: 3
  # How old each series may be before a warning / a failure. Daily series: market days behind the last
  # closed session (FRED posts a day late, so 1 is normal). Weekly and monthly: days since the release
  # that made the latest value known (jobless claims every Thursday, CPI and industrial production
  # mid-month, so a monthly series is not late between two releases).
  freshness:
    daily: {warn: 2, fail: 5}
    weekly: {warn: 10, fail: 24}
    monthly: {warn: 45, fail: 80}
    overrides:             # ETF prices from Tiingo are posted the evening itself
      equity: {warn: 1, fail: 3}
      hy_bond: {warn: 1, fail: 3}
      ig_bond: {warn: 1, fail: 3}
      treasury: {warn: 1, fail: 3}
  # Market days that were not published and stay missing, once understood: "YYYY-MM-DD": "why".
  # They are listed, not hidden; an unlisted gap keeps the health issue open.
  acknowledged_gaps: {}
