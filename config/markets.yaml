  - {id: FRA, ticker: EWQ,  region: europe,   tracks: MSCI France,         benchmark: CAC 40,       name: {fr: France,         en: France},         beta: 0.90, vol: 0.12, fx: {series: DEXUSEU, quote: usd_per, vol: 0.08}}
