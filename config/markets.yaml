# Country equity markets on the World tab (docs/WORLD.md).
#
# Official index levels (S&P 500, CAC 40, DAX, FTSE 100, Nikkei 225...) are licensed by their
# publishers and free feeds of them are research-only. Each market is therefore shown through a
# US-listed country ETF, priced in USD at the US close (Tiingo end-of-day, adjusted for dividends).
# `tracks` is the index the ETF replicates; `benchmark` is the local index people know, for
# context only: its level is never shown.
#
# `fx` converts the USD price to local currency, for display only (the stress states stay in USD):
# FRED H.10 series, `quote` says whether the series is local per USD (per_usd) or USD per local (usd_per);
# `peg` is a fixed local per USD (the riyal); `vol` is the simulated currency volatility. No `fx` = USD.
#
# Synthetic data: beta to the US market, own volatility, regional factor (see pfe_drai/world.py).
markets:
  - {id: USA, ticker: SPY,  region: americas, tracks: S&P 500,             benchmark: S&P 500,      name: {fr: États-Unis,     en: United States},  beta: 1.00, vol: 0.00}
  - {id: CAN, ticker: EWC,  region: americas, tracks: MSCI Canada,         benchmark: S&P/TSX,      name: {fr: Canada,         en: Canada},         beta: 0.90, vol: 0.10, fx: {series: DEXCAUS, quote: per_usd, vol: 0.06}}
  - {id: MEX, ticker: EWW,  region: americas, tracks: MSCI Mexico,         benchmark: S&P/BMV IPC,  name: {fr: Mexique,        en: Mexico},         beta: 0.90, vol: 0.20, fx: {series: DEXMXUS, quote: per_usd, vol: 0.12}}
  - {id: BRA, ticker: EWZ,  region: americas, tracks: MSCI Brazil 25/50,   benchmark: Ibovespa,     name: {fr: Brésil,         en: Brazil},         beta: 1.10, vol: 0.28, fx: {series: DEXBZUS, quote: per_usd, vol: 0.16}}
